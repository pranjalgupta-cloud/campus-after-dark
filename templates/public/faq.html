{% extends "base.html" %}
{% block title %}FAQ{% endblock %}
{% block content %}
<div class="cad-page-hero"><div class="container"><h2 class="fw-800 text-navy">Frequently Asked Questions</h2></div></div>
<div class="container py-5" style="max-width:760px;">
  <div class="accordion" id="faqAccordion">
    {% for qa in faqs %}<div class="accordion-item mb-2 border rounded"><h2 class="accordion-header"><button class="accordion-button collapsed fw-600" type="button" data-bs-toggle="collapse" data-bs-target="#faq{{ forloop.counter }}">{{ qa.q }}</button></h2><div id="faq{{ forloop.counter }}" class="accordion-collapse collapse" data-bs-parent="#faqAccordion"><div class="accordion-body text-muted">{{ qa.a }}</div></div></div>{% endfor %}
  </div>
</div>
{% endblock %}
